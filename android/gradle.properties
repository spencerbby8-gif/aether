# 2 GB sandbox: 3072m gets the daemon OOM-killed during R8 (verified in dmesg).
# Measured: -Xmx3072m and -Xmx1280m both got the daemon OOM-killed in this
# 1984 MB sandbox with no swap (anon-rss 1.45 GB at the kill, see dmesg).
# 896m/256m then died with "ran out of JVM Metaspace" -> "build daemon
# disappeared unexpectedly", so the split is wrong rather than the total:
# R8 wants more metaspace than 256m. 768/384 keeps the same ~1.15 GB ceiling.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
