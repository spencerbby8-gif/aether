name: Antigravity provider smoke
run-name: Antigravity smoke - ${{ inputs.probe }}

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Provider capability to check independently
        required: true
        type: choice
        options: [discovery, streaming, tool-call]
        default: discovery
      model_id:
        description: Exact ID for streaming and tool-call checks
        required: false
        type: string

permissions: {}

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated compatibility check
        env:
          PROVIDER_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          PROVIDER_BASE: ${{ secrets.ANTIGRAVITY_BASE_URL }}
          TEST_MODEL: ${{ inputs.model_id }}
          TEST_PROBE: ${{ inputs.probe }}
        run: |
          node --input-type=module <<'NODE'
          const { PROVIDER_KEY, PROVIDER_BASE, TEST_MODEL, TEST_PROBE } = process.env;
          const probe = TEST_PROBE;
          const key = (PROVIDER_KEY ?? '').trim();
          const model = (TEST_MODEL ?? '').trim();
          let stage = 'configuration';
          async function* read(response) {
            if (!response.body) throw new Error();
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let bytes = 0;
            try {
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                bytes += value.byteLength;
                if (bytes > 1_048_576) throw new Error();
                yield decoder.decode(value, { stream: true });
              }
              yield decoder.decode();
            } finally {
              await reader.cancel().catch(() => {});
              reader.releaseLock();
            }
          }
          async function json(response) {
            let text = '';
            for await (const chunk of read(response)) text += chunk;
            return JSON.parse(text);
          }
          try {
            if (!key || !['discovery', 'streaming', 'tool-call'].includes(probe)) throw new Error();
            if (probe !== 'discovery' && !model) throw new Error();
            if (model.length > 256 || /[\r\n]/.test(model)) throw new Error();
            const base = new URL((PROVIDER_BASE ?? '').trim());
            if (base.protocol !== 'https:' || base.username || base.password || base.search || base.hash) throw new Error();
            base.pathname = base.pathname.replace(/\/+$/, '') + '/';
            async function request(path, body, { authenticated = true, stream = false } = {}) {
              const headers = { Accept: stream ? 'text/event-stream' : 'application/json' };
              if (authenticated) headers.Authorization = `Bearer ${key}`;
              if (body) headers['Content-Type'] = 'application/json';
              const response = await fetch(new URL(path, base), {
                method: body ? 'POST' : 'GET', headers,
                body: body ? JSON.stringify(body) : undefined,
                redirect: 'error', signal: AbortSignal.timeout(65_000),
              });
              if (authenticated && !response.ok) {
                console.error(`Provider returned HTTP ${response.status}.`);
                await response.body?.cancel().catch(() => {});
                throw new Error();
              }
              return response;
            }

            stage = probe;
            if (probe === 'discovery') {
              const catalog = await json(await request('models'));
              if (!Array.isArray(catalog?.data)) throw new Error();
              if (model && !catalog.data.some(item => item?.id === model)) throw new Error();
              console.log(model ? 'PASS: exact model was listed.' : 'PASS: models catalog returned.');
              const noKey = await request('models', undefined, { authenticated: false });
              const status = noKey.status;
              await noKey.body?.cancel().catch(() => {});
              console.log(status === 401 || status === 403
                ? 'PASS: models request without bearer key was denied.'
                : 'INCONCLUSIVE: model listing does not establish key enforcement.');
            } else if (probe === 'streaming') {
              const response = await request('chat/completions', {
                model, stream: true, max_tokens: 768,
                messages: [{ role: 'user', content: 'Reply to the user with exactly the word ready.' }],
              }, { stream: true });
              if (!response.headers.get('content-type')?.toLowerCase().includes('text/event-stream')) {
                await response.body?.cancel().catch(() => {});
                throw new Error();
              }
              let pending = '';
              let sawText = false;
              let done = false;
              for await (const chunk of read(response)) {
                pending += chunk;
                let boundary;
                while ((boundary = /\r?\n\r?\n/.exec(pending))) {
                  const data = pending.slice(0, boundary.index).split(/\r?\n/)
                    .filter(line => line.startsWith('data:')).map(line => line.slice(5).replace(/^ /, '')).join('\n');
                  pending = pending.slice(boundary.index + boundary[0].length);
                  if (!data.trim()) continue;
                  if (data.trim() === '[DONE]') { done = true; break; }
                  const event = JSON.parse(data);
                  if (event?.error) throw new Error();
                  const choice = event?.choices?.[0];
                  if (typeof choice?.delta?.content === 'string' && choice.delta.content.trim()) sawText = true;
                  if (choice?.finish_reason === 'stop') { done = true; break; }
                  if (choice?.finish_reason) throw new Error();
                }
                if (done) break;
              }
              if (!sawText || !done) throw new Error();
              console.log('PASS: provider returned user-facing SSE text and a terminal marker.');
            } else {
              const result = await json(await request('chat/completions', {
                model, stream: false, max_tokens: 768,
                messages: [{ role: 'user', content: 'Use format_label with label set to ready.' }],
                tools: [{ type: 'function', function: {
                  name: 'format_label', description: 'Format a test label.',
                  parameters: { type: 'object', properties: { label: { type: 'string' } }, required: ['label'], additionalProperties: false },
                } }],
                tool_choice: 'auto',
              }));
              const calls = result?.choices?.[0]?.message?.tool_calls;
              const call = calls?.[0];
              if (calls?.length !== 1 || call?.type !== 'function' || !call.id ||
                  call.function?.name !== 'format_label' || JSON.parse(call.function.arguments)?.label !== 'ready') throw new Error();
              console.log('PASS: structured tool proposal accepted; nothing was executed.');
            }
          } catch {
            console.error(`FAIL: ${stage}. Provider URL, credential, response and raw errors are not logged.`);
            process.exitCode = 1;
          }
          NODE
