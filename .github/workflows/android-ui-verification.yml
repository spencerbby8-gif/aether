name: Android UI verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'android/ui-verification-*'
      - 'android/agent-runtime-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm preinstalled Android SDK
        run: |
          printf 'Android SDK: %s\n' "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          "$SDKMANAGER" --list_installed | head -30

      - name: Confirm hosted Gradle
        run: gradle --version

      - name: Install Android compile components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Clean full Android build
        working-directory: android
        run: |
          test ! -f app/src/main/assets/aether-credentials.dat
          gradle --no-daemon clean :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'

      - name: Verify engine source integrity
        run: node scripts/verify-engine-source.mjs

      - name: Run local Agent protocol and real command proofs
        run: |
          mkdir -p /tmp/aether-agent-proofs
          curl -fsSL -o /tmp/aether-agent-proofs/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          SRC=android/app/src/main/java/com/aether/app
          javac -encoding UTF-8 -cp /tmp/aether-agent-proofs/json.jar -d /tmp/aether-agent-proofs/classes \
            "$SRC/EngineCore.java" "$SRC/ByokClient.java" "$SRC/ByokAgent.java" \
            "$SRC/LocalToolRegistry.java" "$SRC/McpClient.java" "$SRC/core/AgentActivity.java" \
            scripts/proofs/ByokAgentProof.java scripts/proofs/LocalToolRegistryProof.java scripts/proofs/McpClientProof.java
          java -cp /tmp/aether-agent-proofs/classes:/tmp/aether-agent-proofs/json.jar ByokAgentProof
          java -cp /tmp/aether-agent-proofs/classes:/tmp/aether-agent-proofs/json.jar LocalToolRegistryProof
          java -cp /tmp/aether-agent-proofs/classes:/tmp/aether-agent-proofs/json.jar McpClientProof

      - name: Run engine, MCP and question protocol proofs
        run: |
          python3 scripts/proofs/engine-request-check.py
          python3 scripts/proofs/agent-loop-check.py
          python3 scripts/proofs/mcp-client-check.py
          python3 scripts/proofs/workspace-recovery-check.py

      - name: Upload APKs for the hardware-accelerated emulator
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 21 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the exact APKs built on Linux
        uses: actions/download-artifact@v4
        with:
          name: aether-android-apks
          path: apks

      - name: Verify and flatten the downloaded APK paths
        run: |
          find apks -type f -printf '%P\n' | sort
          test -f apks/debug/app-debug.apk
          test -f apks/androidTest/debug/app-debug-androidTest.apk
          mv apks/debug/app-debug.apk apks/app-debug.apk
          mv apks/androidTest/debug/app-debug-androidTest.apk apks/app-debug-androidTest.apk

      - name: Enable hardware virtualization for the Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run the accelerated emulator and capture real UI evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          avd-name: aether-ui
          force-avd-creation: true
          disable-linux-hw-accel: false
          ram-size: 4096
          heap-size: 512
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb install -r apks/app-debug.apk
            adb install -r apks/app-debug-androidTest.apk
            adb logcat -c
            set -o pipefail
            TEST_STATUS=0
            set +e
            adb shell am instrument -w -r -e class com.aether.app.ScreenshotTest com.aether.app.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a instrumentation.log
            CLASS_STATUS=$?
            set -e
            if [ "$CLASS_STATUS" -ne 0 ]; then TEST_STATUS=1; fi
            set +e
            adb shell am instrument -w -r -e class com.aether.app.LiveExecutionHandshakeTest com.aether.app.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a instrumentation.log
            CLASS_STATUS=$?
            set -e
            if [ "$CLASS_STATUS" -ne 0 ]; then TEST_STATUS=1; fi
            set +e
            adb shell am instrument -w -r -e class com.aether.app.LocalAgentInteractionTest com.aether.app.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a instrumentation.log
            CLASS_STATUS=$?
            set -e
            if [ "$CLASS_STATUS" -ne 0 ]; then TEST_STATUS=1; fi
            set +e
            adb shell am instrument -w -r -e class com.aether.app.ExhaustiveThemeTest com.aether.app.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee -a instrumentation.log
            CLASS_STATUS=$?
            set -e
            if [ "$CLASS_STATUS" -ne 0 ]; then TEST_STATUS=1; fi
            adb logcat -d -v threadtime > logcat.txt || true
            rm -rf screenshots
            mkdir -p screenshots/live-execution screenshots/theme-audit
            adb pull /sdcard/Android/data/com.aether.app.debug/files/screenshots/. screenshots/ || true
            adb pull /sdcard/Android/data/com.aether.app.debug/files/live-execution/. screenshots/live-execution/ || true
            adb pull /sdcard/Android/data/com.aether.app.debug/files/local-agent-interaction/. screenshots/local-agent-interaction/ || true
            adb pull /sdcard/Android/data/com.aether.app.debug/files/theme-audit/. screenshots/theme-audit/ || true
            if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
            test -f screenshots/01-chat-welcome.png
            test -f screenshots/05-model-picker.png
            test -f screenshots/10-settings-home.png
            test -f screenshots/16-privacy-policy.png
            test -f screenshots/18-activity-command-summary.png
            test -f screenshots/20-agent-question-second.png
            test -f screenshots/21-keyboard-open.png
            test -f screenshots/22-new-chat-welcome.png
            test -f screenshots/verification.json
            cat screenshots/verification.json
            test -f screenshots/live-execution/light-manual-command-before-execution.png
            test -f screenshots/live-execution/light-command-folded-after-completion.png
            test -f screenshots/local-agent-interaction/01-command-output-while-agent-continues.png
            test -f screenshots/local-agent-interaction/02-command-output-collapsed.png
            test -f screenshots/local-agent-interaction/03-command-output-expanded-again.png
            test -f screenshots/local-agent-interaction/04-command-complete-and-auto-folded.png
            grep -q '"collapseExpandVerified": true' screenshots/local-agent-interaction/verification.json
            test -f screenshots/theme-audit/light-settings-home.png
            test -f screenshots/theme-audit/midnight-settings-home.png
            test "$(find screenshots/theme-audit -name '*.png' | wc -l)" -ge 100

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-ui-evidence
          path: |
            screenshots/
            instrumentation.log
            logcat.txt
            apks/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
