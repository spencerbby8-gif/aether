name: Android UI verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'android/ui-verification-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm preinstalled Android SDK
        run: |
          printf 'Android SDK: %s\n' "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          "$SDKMANAGER" --list_installed | head -30

      - name: Confirm hosted Gradle
        run: gradle --version

      - name: Install Android compile components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Clean full Android build
        working-directory: android
        run: |
          test ! -f app/src/main/assets/aether-credentials.dat
          gradle --no-daemon clean :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'

      - name: Verify engine source integrity
        run: node scripts/verify-engine-source.mjs

      - name: Upload APKs for the hardware-accelerated emulator
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 21 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the exact APKs built on Linux
        uses: actions/download-artifact@v4
        with:
          name: aether-android-apks
          path: apks

      - name: Restore the previously booted Android virtual device
        uses: actions/cache@v4
        with:
          path: ~/.android/avd
          key: aether-avd-api35-default-pixel6-v2

      - name: Run the cached emulator and capture real UI evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          avd-name: aether-ui
          force-avd-creation: false
          ram-size: 4096
          heap-size: 512
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb install -r apks/app-debug.apk
            adb install -r apks/app-debug-androidTest.apk
            adb logcat -c
            set -o pipefail
            set +e
            adb shell am instrument -w -r -e class com.aether.app.ScreenshotTest com.aether.app.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee instrumentation.log
            TEST_STATUS=$?
            set -e
            adb logcat -d -v threadtime > logcat.txt || true
            rm -rf screenshots
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.aether.app.debug/files/screenshots/. screenshots/ || true
            if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
            test -f screenshots/01-chat-welcome.png
            test -f screenshots/03-model-picker.png
            test -f screenshots/05-settings-home.png
            test -f screenshots/11-privacy-policy.png
            test -f screenshots/12-activity-recorded-fixture.png
            test -f screenshots/13-new-chat-welcome.png
            test -f screenshots/verification.json
            cat screenshots/verification.json

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-ui-evidence
          path: |
            screenshots/
            instrumentation.log
            logcat.txt
            apks/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
